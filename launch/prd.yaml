# The platform's own launch PRD (doc 25 §76.4) — P20 executed through the
# machinery it ships. Gate PL2 approval and the publish button are human.
prd:
  id: PRD-LAUNCH-2026-01
  problem_statement: "The framework is complete and measured but unknown; without adoption its evidence discipline helps exactly one team."
  evidence_refs: [PC-2, PC-3, PC-8, PC-9]
  affected_segment: {name: "solo founders and agent engineers", size_claim: PC-8}
  non_goals:
    - "No paid acquisition of any kind, ever (ADR-U20)."
    - "No cross-framework comparison marketing — our benchmark is runnable, theirs was not run (§74.1)."
    - "No email channel at launch: a fresh domain has none of the §21.58.3 telemetry."
  # O-L1 (weekly_maintenance_attention_hours) was WITHDRAWN in v0.81.0 —
  # ADR-033. Its instrumentation never existed and could not: the number had
  # to be typed by the founder every week, so the axis measured willingness to
  # answer a prompt, not maintenance load. The id is not reused.
  outcomes:
    - id: O-L2
      metric: product_bench_build_rate
      definition_ref: metrics/product_bench_capability.md
      baseline: {value: 0.74, source: "benchmarks/results/HISTORY.md run 11 (74% build, 75% probes, 38% clean); run 10 was 75/75/43 — measured, not projected"}
      target: {value: 0.60, by: "2026-10-31"}
      instrumentation: {event: product_bench.case_built, exists: true}
  demand_hypotheses:
    - id: H-L1
      statement: "the no-key replay rung is the entry adopters actually use before configuring a key"
      falsifier: "fewer than half of the first 10 key-configured adopters report trying replay --demo first (asked directly, n recorded)"
      check: {stage: P4, method: qualitative, window_days: 30}
  scope_tier: thin
  # The maintenance-attention criterion that stood first here was withdrawn
  # with O-L1 (v0.81.0, ADR-033). One axis remains, and it is the one whose
  # series is actually collected.
  kill_criteria:
    - "If the product-bench build rate falls below 60% OR the probe pass rate below 50% for 2 consecutive weekly runs, the capability claim is not holding and scope is cut per Gate PL5. The 60/50 floors read the observed pre-fix era (42-54% build) against the current 74-75% — a real floor, not a chosen number; the series is benchmarks/results/HISTORY.md, and since v0.82.0 its collection is a watched cadence loop (ADR-034), so a run that stops happening is a Discord alert rather than a criterion that reports 'not fired' forever. Both rates are read over the cases that PRODUCED them (ADR-035): a case that never ran is dropped from the average and named in `unmeasured`, never entered as a zero, because an infrastructure crash must not be able to fire a capability verdict."
  # Amended 2026-08-12, v0.82.0. What stood here said the series was
  # "already collected weekly, so this can fire on the next run". The
  # collection had in fact stopped on 2026-07-27 and went 16 days unnoticed:
  # the claim was about a cron entry nobody was watching, not about the
  # criterion. The floors and the rule are unchanged; only the sentence
  # about what keeps the series alive is corrected, and it now names the
  # mechanism that enforces it.
  #
  # Amended again 2026-08-13, v0.83.0. The first scheduled run showed the
  # other half: a case killed by a hung subprocess was averaged in as 0.0,
  # dropping the probe rate 22 points, and the run exited 0. The floors and
  # the rule are unchanged and the baseline stands (runs 1-11 hold no
  # crashed cases except run 4, already excluded as noise); what changes is
  # WHAT the rates are averaged over. See ADR-035 and the 2026-08-12
  # definition change in metrics/product_bench_capability.md.
