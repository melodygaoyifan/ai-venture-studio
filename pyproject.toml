[project]
name = "ai-venture-studio"
version = "0.110.0"
description = "AI venture studio: a full-lifecycle multi-agent system that finds opportunities, writes PRDs, builds, launches, and measures — with typed claims and human gates"
readme = "README.md"
authors = [
    { name = "melodygaoyifan", email = "168382010+melodygaoyifan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.118.0",
    "fastapi>=0.139.2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

license = "MIT"
keywords = ["multi-agent", "ai", "product", "sdlc", "autopilot", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# Build-report screenshots are the only playwright consumer, and they
# already skip visibly when it is absent. Keeping it out of the base
# install matters behind enterprise firewalls, where the post-install
# browser download is blocked and a hard dependency would look broken.
screenshots = [
    "playwright>=1.61.0",
]

[project.urls]
Homepage = "https://github.com/melodygaoyifan/ai-venture-studio"
Changelog = "https://github.com/melodygaoyifan/ai-venture-studio/blob/main/CHANGELOG.md"

[project.scripts]
avs = "ai_venture_studio.cli:main"
# The old command stays as an alias: anything scripted against `autoproduct`
# (cron entries, CI steps, a founder's shell history) keeps working. Docs use
# `avs`. Removing this is a separate, breaking decision.
autoproduct = "ai_venture_studio.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mutmut>=3.6.0",
    "pycryptodome>=3.20",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

# ADR-055. `F` only — pyflakes rules, the ones that describe code that cannot
# work rather than code someone would format differently. This project has
# never had a style linter and is not acquiring one here: reformatting 300
# files would bury the class of finding this gate exists to catch.
#
# F821 (undefined name) is the whole reason for the gate. `avs bench-criterion`
# shipped ten orphaned lines calling a function that existed nowhere, and
# crashed on every healthy run for eleven recorded benchmarks (ADR-054). It
# was found by running the command; a linter finds it in 300ms without an
# API key, a workspace, or five hours of benchmark.
[tool.ruff]
target-version = "py312"
extend-exclude = ["blocks", "edition_data", "profiles", "skills"]

# ADR-062 widened this past `F`. The line held is the same one ADR-055 drew:
# rules that describe code which cannot work, or which works differently from
# how it reads. Not style. `I` (61), `Q` (37), `ISC` (29), `N` (27), `UP` (24),
# `SIM` (23) are all deliberately OUT — adopting them reformats hundreds of
# files in one commit and buries the class of finding this gate exists for.
#
# What was added, and why:
#   B    bugbear — the reason for the widening. 13 `zip()`s with no `strict=`,
#        a mutable default, and two closures capturing a loop variable. Two of
#        the zips were live defects: `desync_probe` read a short client stream
#        as "no divergence", and `check_substantiation` skipped every number
#        past the register entry's last one.
#   S    bandit. `S110`/`S112` are a CLAUDE.md rule with no enforcement until
#        now — "never silently swallow exceptions; log the error or handle it
#        explicitly" — and src had 15. `S607` is a second such rule ("absolute
#        executable paths, never partial paths"); it was ignored-with-a-reason
#        for one afternoon and then fixed at all 152 sites (ADR-064), which is
#        the only ending an ignore-with-a-reason is supposed to have.
#   BLE  blind `except Exception`. Zero findings only because every site
#        already carries `# noqa: BLE001` with a written reason; selecting it
#        makes the next one require a reason too, which is the whole value.
#   W    pycodestyle warnings, for W605 (invalid escape sequence in a regex).
#   A    builtin shadowing. PIE, RET, RSE, PTH, C4, LOG, G, TID: zero or one
#        finding each, so they cost nothing to hold from here on.
[tool.ruff.lint]
select = [
    "F", "B", "S", "BLE", "W", "A", "PIE", "RET", "RSE", "PTH", "C4",
    "LOG", "G", "TID",
]

ignore = [
    # The rule this encodes — "list argv, never `shell=True`" — is a CLAUDE.md
    # invariant that IS met: `S602`/`S604`/`S605` (the `shell=True` rules) are
    # selected above and find nothing. `S603` fires on every correctly-written
    # `subprocess.run([...])` in the repo and says only "check the input",
    # which is the reviewer's job and not a fact a linter established.
    "S603",
    # Every hit is the NAME of an environment variable — `SENTRY_TOKEN_ENV =
    # "AUTOPRODUCT_SENTRY_TOKEN"` — matched because the identifier contains
    # "token". The repo's actual rule ("secrets stay in the environment") is
    # what produces these constants, so the check fires hardest exactly where
    # the code is right. A rule that fires on the correct pattern trains
    # people to skim, and there is no variant of it that does not.
    "S105", "S106",
]

[tool.ruff.lint.per-file-ignores]
# A package __init__ exists to re-export; an unused import there is the job.
# `lanes/__init__.py` computes `__all__` from `dir()`, which no linter can
# follow, and the 47 names it lifts are the lanes' public surface.
"__init__.py" = ["F401"]
# `typer.Option(...)` in a parameter default is Typer's declared API, not the
# shared-mutable-default bug B008 describes. Scoped to the CLI so the real
# B008 shape is still caught everywhere else.
"src/ai_venture_studio/cli.py" = ["B008"]
# An assert IS the test. src/ is at zero and stays there — that is the
# CLAUDE.md rule ("replace all runtime assert statements") under enforcement
# for the first time, and it only means anything if tests are exempt.
#
# S104 (bind all interfaces) and S108 (`/tmp`) are here for the same reason
# and no wider: a test that asserts on the string `0.0.0.0` or on a path a
# founder might type is describing the input, not choosing it. Both are still
# live in src/, where choosing it is what the code would be doing.
"tests/**" = ["S101", "S104", "S108"]
