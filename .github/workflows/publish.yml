# Publish to PyPI via Trusted Publishing (OIDC) — no API token anywhere.
#
# Why this and not a token in a secret: a long-lived PyPI token in repo
# secrets is a credential that can be exfiltrated by any workflow change and
# never expires until someone remembers to rotate it. Trusted Publishing
# mints a short-lived, audience-scoped credential per run, so there is no
# secret to leak, and the publisher is pinned to this repo + this workflow.
#
# ONE-TIME SETUP (only the PyPI account owner can do this):
#   https://pypi.org/manage/account/publishing/ → add a pending publisher
#     PyPI project name: ai-venture-studio
#     Owner:             melodygaoyifan
#     Repository:        ai-venture-studio
#     Workflow name:     publish.yml
#     Environment:       pypi
#
# THEN, to release: bump `version` in pyproject.toml, land it on main, and
#   git tag v0.54.0 && git push origin v0.54.0
#
# AFTER this workflow is green, PyPI having the file is not the same as the
# file working, and published is not the same as deployed. Finish with:
#   scripts/verify-release.sh --deploy
# which installs the published version into a throwaway venv, proves the
# `avs` console script exists and runs, and only then upgrades the binary the
# schedulers actually invoke. Do not hand-roll that check: the three times it
# was typed from memory it was `pip install -q ... | tail -3`, which cannot
# tell a failed install from a successful one. See the script's header.
#
# The gate is deliberate: the suite must pass on the tagged commit before
# anything is uploaded, because a PyPI version cannot be replaced — only
# yanked. The tag must also match the version in pyproject.toml, so a
# mistyped tag fails loudly instead of publishing the wrong number.
name: publish
on:
  push:
    tags: ["v*"]

# KEYED ON THE TAG, never on the workflow. A re-pushed tag is the only case
# where two runs are racing to upload the same filenames, and cancelling the
# older one is the whole remedy — the alternative is both runs alive, one of
# them uploading a build the tag no longer points at, and PyPI keeping
# whichever won. A constant group here would be actively harmful: v0.110.0 and
# v0.111.0 pushed a minute apart are two legitimate releases, and the second
# must not cancel the first mid-upload (ADR-065).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name avs-ci
      - run: uv sync
      # Kept in step with ci.yml deliberately. "The same gate" stated in prose
      # and assembled twice by hand is one control with two call paths, and
      # the one nobody looks at is the one that silently does less (ADR-051) —
      # a release is a bad place to discover which of the two that is.
      - run: uv run ruff check .
      # The same gate as ci.yml: hermetic suite plus the ADR-U29 self-lint.
      # AVS_RELEASE_CHECK additionally makes PC-1 fatal: this run is the tag
      # PC-1's own wording points at ("at the current tag"), so a claimed test
      # count that disagrees with the count that just passed fails the release
      # rather than publishing a number nobody measured. It sat at 1572 while
      # the suite passed 1655 — through several commits and a release — because
      # the ledger was only ever enforced against OVERclaiming.
      - run: uv run pytest -q
        env:
          AVS_RELEASE_CHECK: "1"
      - name: tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi          # lets you require a manual approval here
    permissions:
      id-token: write          # the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
      - name: check artifacts the way PyPI will
        run: uvx twine check dist/*
      - name: publish
        # --check-url makes this idempotent: files already on PyPI are skipped
        # rather than failing the run, so re-tagging or a manual publish
        # followed by a tag push does not produce a red release.
        #
        # Which is also how it hides the one case that matters. "Already on
        # PyPI" is decided by FILENAME, and a re-tagged commit builds a
        # different wheel under the same name — so the run that was supposed
        # to correct the release skips its own upload and reports success.
        # The step below is what makes that loud (ADR-065).
        run: uv publish --check-url https://pypi.org/simple/
      - name: PyPI must serve what this run built
        # Green is not the same as published, for the same reason published is
        # not the same as deployed. This asks the index for the sha256 of every
        # file it is serving under this version and compares it to the files on
        # this runner — so a skipped upload, a half-finished upload from a
        # cancelled race, and a correct release are three distinguishable
        # outcomes instead of one green check.
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/verify-published.py ai-venture-studio "$version" dist
