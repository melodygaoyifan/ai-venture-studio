  - id: PC-17
    text: "product benchmark, real cases run 16 (2026-08-16, v0.93.0, n=3 of 4 cases measured — 02-shortener-api produced no plan and is excluded): build 100%, probe pass 75%, clean review 31%"
    kind: demand
    source_type: primary_measured
    n: 3
    evidence:
      - {method: product_bench_run, locator: "repo://benchmarks/results/result-2026-08-16-0612.yaml (cases_measured 3 of 4)",
         retrieved_at: "2026-08-16T06:12:00Z"}
    falsifier: "the preserved run-16 result containing different rates, or a cases_measured other than the 3 of 4 this claim names"
    note: >-
      These are the file's recorded values and they are internally
      inconsistent: `unmeasured` is derived per-rate rather than per-case, so
      02-shortener-api was dropped from build and clean while its two probes
      — run against a product that was never built — were averaged in as
      0.0. The exclusion itself was the error: the case ran and produced
      nothing, which ADR-035 already calls a real 0.0. ADR-043 makes
      measured one per-case decision; the recorded numbers above are not
      rewritten, and run 17 is the first comparable build rate.

      CORRECTED READING, AMENDED BY ADR-061: build 75%, probes 100% over 3
      of 4, clean 31%, no case excluded. This supersedes the "probes 75%"
      this note carried between ADR-043 and ADR-061. The build half is
      unchanged — 02-shortener-api ran, produced nothing, and scores a real
      0.0. The probe half was wrong in the other direction: a case that
      built nothing has no product to probe, so counting its two failing
      probes charged ONE failure to TWO of the three headline rates, and a
      probe column that mirrors the build column measures nothing
      independently. What ADR-043 got right and ADR-061 keeps is that the
      exclusion must be per-case and must be printed — `no_probe_reading`
      names it now, on the CLI and in the alert.

      CURRENCY: this is the newest bench reading and it is NOT a reading of
      the current build. Run 16 ran on v0.93.0; every release since —
      ADR-044 through ADR-053 — is unmeasured by this series, because run 17
      aborted on credit exhaustion (2026-08-17) after measuring one case.
      Nothing here is wrong; what would be wrong is reading it as the state
      of today's system. The claim ids carry the build for exactly this
      reason, and a reader comparing run 17 to run 16 is comparing across
      that whole span, not across one release.

  - id: PC-18
    text: "product benchmark, real cases run 18 (2026-08-20, v0.106.0, provider anthropic, n=4 of 4 cases measured): build 75%, probe pass 75%, clean review 50%; increment gate 0% over 1 of 1 increment case; measured cost $67.88 over 1913 provider calls"
    kind: demand
    source_type: primary_measured
    n: 4
    evidence:
      - {method: product_bench_run, locator: "repo://benchmarks/results/result-2026-08-20-1459.yaml (cases_measured 4 of 4; rates.increment.cases_measured 1 of 1)",
         retrieved_at: "2026-08-20T14:59:00Z"}
    falsifier: "the preserved run-18 result containing different rates, a cases_measured other than the 4 of 4 this claim names, or a cost block whose usd is not 67.8771 with unpriced_calls 0"
    note: >-
      This is the first bench reading of three things at once, and each is a
      first rather than a movement: the first cost figure the series has ever
      carried ($67.88, fully priced, 0 unpriced calls — ADR-057), the first
      `provider:` stamp on a result (ADR-056), and the first score on the
      increment axis (ADR-049). None of the three has a prior value to be
      compared against.

      The two failing rows are both narrower than they look, and the claim
      should not be read as a capability reading of either. The increment
      gate's 0% is NOT a reading of the gate: all three follow-up FDRs
      returned `needs_answers` from `assess_fdr`, so `run_feature` returned
      at intake and the reconciliation gate was never reached. And one of
      the two probes on that case could not have passed in any run — it did
      not parse (a Python line continuation inside a YAML folded scalar).
      The gate rate here measures the intake bar, not reconciliation.
      HISTORY.md records both in full.

      Six defects found by inspecting this run and run 17 are fixed in
      v0.107.0 (ADR-058) — the intake bar above among them, plus the YAML
      quoting rule behind twelve of the run's seventeen blocked votes, which
      is the ceiling under the 50% clean rate. NONE OF THE RECORDED VALUES
      ABOVE ARE RE-SCORED. They are what run 18 measured on v0.106.0; a
      reader comparing them to run 19 is comparing across those fixes.

      THE 75% PROBE RATE IS A DOUBLE COUNT, found by mining this run's rows
      rather than by another run (ADR-061, v0.109.0). 03-groupbuy-auto was
      blocked at planning, built 0 of 0 tasks, and was charged a hard 0.0 in
      the probe column as well as the build column — one failure moving two
      of the three headline numbers. Three cases were probed and all three
      passed, so under the current rule these rows read `probes 100% over 3
      of 4`. The recorded 0.75 stands and is not rewritten; a test pins it.

      SPAN: run 18 is nine-plus releases from run 16 (v0.93.0 → v0.106.0),
      so ADR-044 through ADR-057 all moved at once between these two rows.
      No single record can be credited or blamed for the delta, and the
      build rate falling 100% → 75% is one case (03-groupbuy-auto) that
      never built a task because its plan was blocked on a lane collision
      the planner could not resolve in three attempts.
